---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: elasticnodes.nightwatch.imla.ch
spec:
  group: nightwatch.imla.ch
  names:
    kind: ElasticNode
    listKind: ElasticNodeList
    plural: elasticnodes
    shortNames:
    - en
    singular: elasticnode
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.desiredPower
      name: Desired
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.observedPower
      name: Power
      type: string
    - jsonPath: .status.nodeReady
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ElasticNode is the desired power-state record for one target-cluster
          node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ElasticNodeSpec is the desired intent - the only state Nightwatch
              persists.
            properties:
              clusterRef:
                description: |-
                  ClusterRef names the target workload cluster this node lives on, for the
                  future multi-cluster Backends provider. Empty selects the default target.
                type: string
              desiredPower:
                default: "On"
                description: |-
                  DesiredPower is the target power state. Defaults to On (fail-safe: a node
                  whose intent is unknown stays in service).
                enum:
                - "On"
                - "Off"
                type: string
              desiredReason:
                description: |-
                  DesiredReason records why the intent is what it is (e.g. "quiet-mode",
                  "ups-load-shed", "manual") - surfaced in events/status, not control logic.
                type: string
            type: object
          status:
            description: |-
              ElasticNodeStatus is best-effort observability written on transitions. It is
              NEVER used to decide the next action - the reconciler recovers from spec + the
              live world.
            properties:
              conditions:
                description: Conditions follows the standard metav1.Condition pattern.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gpuRegistered:
                description: GPURegistered is whether the node advertised GPU allocatable
                  at last observe.
                type: boolean
              lastTransitionTime:
                description: LastTransitionTime is when Phase last changed.
                format: date-time
                type: string
              nodeReady:
                description: NodeReady mirrors the target-cluster node's Ready condition
                  at last observe.
                type: boolean
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              observedPower:
                description: ObservedPower is the last power state read from the BMC.
                enum:
                - "On"
                - "Off"
                type: string
              phase:
                description: Phase is the coarse observed lifecycle state.
                enum:
                - Ready
                - Draining
                - Blocked
                - "Off"
                - PoweringOn
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
