# Leader-election lease + coordination (active/standby singleton on mgmt etcd).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nightwatch-operator-leader-election-role
  namespace: nightwatch
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
