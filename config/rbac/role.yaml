---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nightwatch-operator-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - nightwatch.imla.ch
  resources:
  - elasticnodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nightwatch.imla.ch
  resources:
  - elasticnodes/finalizers
  verbs:
  - update
- apiGroups:
  - nightwatch.imla.ch
  resources:
  - elasticnodes/status
  verbs:
  - get
  - patch
  - update
